name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-targets --all-features

      - name: Release build
        run: cargo build --locked --release

      - name: Standalone binary smoke
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/mstyle
          "$binary" --version
          printf 'x = 1;\n' > binary-smoke.m
          "$binary" lint binary-smoke.m
          "$binary" check binary-smoke.m

          printf 'x=1 ;\n' > format-smoke.m
          "$binary" fmt format-smoke.m
          test "$(cat format-smoke.m)" = "x = 1;"

          formatted="$(printf 'x=1 ;' | "$binary" fmt --stdin)"
          test "$formatted" = "x = 1;"

      - name: Unix installer smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/install.sh --dry-run --version v0.1.0 --install-dir "$RUNNER_TEMP/mstyle-bin"

      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ./scripts/install.ps1 -DryRun -Version v0.1.0 -InstallDir "$env:RUNNER_TEMP\mstyle-bin"
          if (-not ($output -match "asset=mstyle-windows-x86_64.exe")) {
              throw "installer dry-run did not resolve the Windows x86_64 asset"
          }

      - name: Installer smoke
        shell: bash
        run: |
          set -euo pipefail
          output="$(sh scripts/install.sh --dry-run --version v0.1.0 --install-dir "$RUNNER_TEMP/mstyle-bin")"
          grep -F "asset=mstyle-linux-x86_64" <<< "$output"

      - name: Benchmark smoke
        run: MSTYLE_BENCH_ITERS=10 cargo run --locked --release --example benchmark

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Octave tests
        run: |
          OCTAVE_BIN="$(command -v octave-cli || command -v octave)"
          test -n "$OCTAVE_BIN"
          "$OCTAVE_BIN" --version
          "$OCTAVE_BIN" --no-gui --quiet --eval "addpath('tests/octave'); run_tests"

      - name: mstyle self-check format
        run: cargo run --locked --release -- fmt --check tests/selfcheck

      - name: mstyle self-check lint
        run: cargo run --locked --release -- lint tests/selfcheck

  build-platforms:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Release build
        run: cargo build --locked --release

      - name: Standalone binary smoke
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/mstyle
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary=target/release/mstyle.exe
          fi

          "$binary" --version
          printf 'x = 1;\n' > binary-smoke.m
          "$binary" lint binary-smoke.m
          "$binary" check binary-smoke.m

          printf 'x=1 ;\n' > format-smoke.m
          "$binary" fmt format-smoke.m
          test "$(cat format-smoke.m)" = "x = 1;"

          formatted="$(printf 'x=1 ;' | "$binary" fmt --stdin)"
          test "$formatted" = "x = 1;"
