name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release

      - name: Benchmark smoke
        run: MSTYLE_BENCH_ITERS=10 cargo run --release --example benchmark

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Octave tests
        run: |
          OCTAVE_BIN="$(command -v octave-cli || command -v octave)"
          test -n "$OCTAVE_BIN"
          "$OCTAVE_BIN" --version
          "$OCTAVE_BIN" --no-gui --quiet --eval "addpath('tests/octave'); run_tests"

      - name: mstyle self-check format
        run: cargo run --release -- fmt --check tests/selfcheck

      - name: mstyle self-check lint
        run: cargo run --release -- lint tests/selfcheck

  build-platforms:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Release build
        run: cargo build --release
