name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Cargo.toml (for example v0.1.0)
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and package version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as file:
              print(tomllib.load(file)["package"]["version"])
          PY
          )"
          expected="v$version"

          case "$EVENT_NAME" in
            pull_request)
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            push)
              tag="$REF_NAME"
              ;;
            workflow_dispatch)
              if [[ "$REF" != "refs/heads/main" ]]; then
                echo "manual releases must be dispatched from main, got $REF" >&2
                exit 1
              fi
              tag="$MANUAL_TAG"
              ;;
            *)
              echo "unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$tag" != "$expected" ]]; then
            echo "release tag $tag does not match Cargo.toml version $version (expected $expected)" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] &&
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; refusing to move or reuse it from a manual release" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mstyle
            artifact: mstyle-linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mstyle.exe
            artifact: mstyle-windows-x86_64.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: mstyle
            artifact: mstyle-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: mstyle
            artifact: mstyle-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          source="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          artifact="dist/${{ matrix.artifact }}"
          cp "$source" "$artifact"

          (
            cd dist
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
            else
              sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
            fi
          )

      - name: Smoke test built binary
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/${{ matrix.artifact }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$binary"
          fi

          "$binary" --version
          printf 'x = 1;\n' > smoke.m
          "$binary" lint smoke.m
          "$binary" check smoke.m

          printf 'x=1 ;\n' > format-smoke.m
          "$binary" fmt format-smoke.m
          test "$(cat format-smoke.m)" = "x = 1;"

          formatted="$(printf 'x=1 ;' | "$binary" fmt --stdin)"
          test "$formatted" = "x = 1;"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  smoke:
    name: Smoke packaged ${{ matrix.artifact }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: mstyle-linux-x86_64
          - runner: windows-latest
            artifact: mstyle-windows-x86_64.exe
          - runner: macos-15-intel
            artifact: mstyle-macos-x86_64
          - runner: macos-15
            artifact: mstyle-macos-arm64

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist

      - name: Run packaged binary without build environment
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/${{ matrix.artifact }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$binary"
          fi

          (
            cd dist
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              shasum -a 256 -c "${{ matrix.artifact }}.sha256"
            else
              sha256sum -c "${{ matrix.artifact }}.sha256"
            fi
          )

          "$binary" --version

          printf 'x = 1;\n' > clean.m
          "$binary" lint clean.m
          "$binary" check clean.m

          printf 'x=1 ;\n' > format-smoke.m
          "$binary" fmt format-smoke.m
          test "$(cat format-smoke.m)" = "x = 1;"

          formatted="$(printf 'x=1 ;' | "$binary" fmt --stdin)"
          test "$formatted" = "x = 1;"

          printf 'a = 1; b = 2;\n' > violation.m
          set +e
          "$binary" lint violation.m
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "expected lint violation exit code 1, got $status" >&2
            exit 1
          fi

  publish:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-mstyle-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$tag"
          elif ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi

          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
