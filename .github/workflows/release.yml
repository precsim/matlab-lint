name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Stage binary
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          arch="$(printf '%s' '${{ runner.arch }}' | tr '[:upper:]' '[:lower:]')"
          case '${{ runner.os }}' in
            Linux)
              platform=linux
              source=target/release/mstyle
              suffix=
              ;;
            Windows)
              platform=windows
              source=target/release/mstyle.exe
              suffix=.exe
              ;;
            macOS)
              platform=macos
              source=target/release/mstyle
              suffix=
              ;;
            *)
              echo "unsupported runner OS: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac
          name="mstyle-${platform}-${arch}${suffix}"
          cp "$source" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: dist/${{ steps.stage.outputs.name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mstyle-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$tag"
          fi
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
