[package]
name = "mstyle"
version = "0.1.0"
edition = "2024"
description = "Fast, conservative MATLAB/Octave formatter and linter"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tree-sitter = "=0.25.3"
tree-sitter-matlab = "=1.3.1"
